[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mp3fy"
version = "1.2.0"
description = "Spotify to MP3 Downloader & ID3 Tagging CLI Tool for PowerShell, Windows & Linux"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2024.0.0",
    "mutagen>=1.47.0",
    "requests>=2.31.0",
    "spotipy>=2.23.0",
    "rich>=13.0.0",
]

[project.scripts]
mp3fy = "main:main"

[tool.setuptools]
packages = ["core"]
py-modules = ["main"]
